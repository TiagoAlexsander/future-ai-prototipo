<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future A.I — Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Cabeçalho (apenas logo no login) -->
    <header class="navbar">
      <div class="logo">Future A.I</div>
    </header>

    <main class="page">
      <!-- Tela de Login -->
      <div id="loginBox" class="container">
        <h2>Bem-vindo à <span class="highlight">Future A.I</span></h2>
        <h3>Faça seu login</h3>

        <form>
          <label for="emailLogin">Email:</label>
          <input type="email" id="emailLogin" name="emailLogin" required />

          <label for="senhaLogin">Senha:</label>
          <input type="password" id="senhaLogin" name="senhaLogin" required />

          <button type="button" onclick="verificarLogin()">Entrar</button>

          <div class="links">
            <button type="button" class="linkBtn">Redefinir Senha</button>
            <button type="button" class="linkBtn" onclick="mudarTelaCadastro()">
              Fazer Cadastro
            </button>
          </div>
        </form>
      </div>

      <!-- Tela de Cadastro -->
      <div id="cadastroTela" class="container hidden">
        <h2>Cadastro de Usuário</h2>
        <form id="formCadastro" onsubmit="cadastrarUsuario(event)">
          <label for="nome">Nome e Sobrenome:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="emailCadastro">Email:</label>
          <input
            type="email"
            id="emailCadastro"
            name="emailCadastro"
            required
          />

          <label for="cpf">CPF:</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="___.___.___-__"
            required
          />

          <label>Data de Nascimento:</label>
          <div class="dataNasc">
            <input type="number" id="dia" placeholder="Dia" required />
            <input type="number" id="mes" placeholder="Mês" required />
            <input type="number" id="ano" placeholder="Ano" required />
          </div>

          <label for="senhaCadastro">Digite sua senha:</label>
          <input
            type="password"
            id="senhaCadastro"
            name="senhaCadastro"
            required
          />

          <label for="confirma">Confirme a Senha:</label>
          <input type="password" id="confirma" name="confirma" required />

          <p class="aviso">A senha deve conter no mínimo 6 dígitos.</p>

          <div class="botoes">
            <button type="button" class="cancelar" onclick="cancelarCadastro()">
              Cancelar
            </button>
            <button type="submit" class="cadastrar">Cadastrar</button>
          </div>
        </form>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
